<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主動式ETF與台股槓桿ETF追蹤回測系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        bordercolor: '#334155',
                        accentgreen: '#10b981',
                        accentred: '#ef4444',
                        accentblue: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col antialiased">

    <div id="app" class="flex h-screen overflow-hidden">

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="hidden md:flex flex-col w-64 bg-cardbg border-r border-bordercolor z-30 transition-all duration-300">
            <div class="p-5 border-b border-bordercolor flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-500/30">
                        <i data-lucide="trending-up" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base tracking-tight text-white">台股槓桿與主動ETF</h1>
                        <p class="text-xs text-slate-400">專業追蹤與回測系統 v2.6</p>
                    </div>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
                <div class="px-3 pb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">核心導覽</div>
                <button onclick="switchTab('overview')" id="nav-overview" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all bg-blue-600 text-white shadow-md">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>總覽與績效比較</span>
                </button>
                <button onclick="switchTab('active-summary')" id="nav-active-summary" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all text-slate-300 hover:bg-slate-800/80">
                    <i data-lucide="layers" class="w-4 h-4 text-emerald-400"></i>
                    <span>五檔主動式ETF持股總統計</span>
                </button>

                <div class="pt-4 px-3 pb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">主動式ETF群組 (5檔)</div>
                <button onclick="switchTab('00981A')" id="nav-00981A" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80">
                    <span class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>00981A 統一台股增長</span></span>
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 px-1.5 py-0.5 rounded">主動</span>
                </button>
                <button onclick="switchTab('00992A')" id="nav-00992A" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80">
                    <span class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>00992A 群益台灣強棒</span></span>
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 px-1.5 py-0.5 rounded">主動</span>
                </button>
                <button onclick="switchTab('00991A')" id="nav-00991A" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80">
                    <span class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>00991A 野村臺灣智慧</span></span>
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 px-1.5 py-0.5 rounded">主動</span>
                </button>
                <button onclick="switchTab('00994A')" id="nav-00994A" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80">
                    <span class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>00994A 富邦台灣動能</span></span>
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 px-1.5 py-0.5 rounded">主動</span>
                </button>
                <button onclick="switchTab('00980A')" id="nav-00980A" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80">
                    <span class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>00980A 元大台灣卓越</span></span>
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 px-1.5 py-0.5 rounded">主動</span>
                </button>

                <div class="pt-4 px-3 pb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">權值與正二槓桿ETF (5檔)</div>
                <button onclick="switchTab('0050')" id="nav-0050" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80">
                    <span class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-blue-500"></span><span>0050 元大台灣50</span></span>
                    <span class="text-xs bg-blue-500/10 text-blue-400 px-1.5 py-0.5 rounded">市值</span>
                </button>
                <button onclick="switchTab('00631L')" id="nav-00631L" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80">
                    <span class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-amber-500"></span><span>00631L 元大台灣50正2</span></span>
                    <span class="text-xs bg-amber-500/10 text-amber-400 px-1.5 py-0.5 rounded">2x槓</span>
                </button>
                <button onclick="switchTab('00685L')" id="nav-00685L" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80">
                    <span class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-amber-500"></span><span>00685L 群益臺灣加權正2</span></span>
                    <span class="text-xs bg-amber-500/10 text-amber-400 px-1.5 py-0.5 rounded">2x槓</span>
                </button>
                <button onclick="switchTab('00675L')" id="nav-00675L" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80">
                    <span class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-amber-500"></span><span>00675L 富邦臺灣正2</span></span>
                    <span class="text-xs bg-amber-500/10 text-amber-400 px-1.5 py-0.5 rounded">2x槓</span>
                </button>
                <button onclick="switchTab('00663L')" id="nav-00663L" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80">
                    <span class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-amber-500"></span><span>00663L 國泰臺灣正2</span></span>
                    <span class="text-xs bg-amber-500/10 text-amber-400 px-1.5 py-0.5 rounded">2x槓</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header class="bg-cardbg border-b border-bordercolor h-16 flex items-center justify-between px-4 lg:px-8 z-20">
                <div class="flex items-center space-x-3">
                    <div>
                        <h2 id="current-page-title" class="text-lg font-bold text-white tracking-tight">總覽與績效比較面板</h2>
                        <p id="current-page-subtitle" class="text-xs text-slate-400 hidden sm:block">即時從雲端載入最新行情與持股變動</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="loadDataAndRefresh()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 transition-all flex items-center space-x-1.5 text-xs font-medium border border-bordercolor">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        <span>重新整理資料</span>
                    </button>
                </div>
            </header>

            <main id="main-viewport" class="flex-1 overflow-y-auto p-4 lg:p-8 bg-darkbg space-y-6">
                <!-- 動態載入 -->
            </main>
        </div>
    </div>

    <script>
        let globalData = null;
        let currentTab = 'overview';
        let activeChart = null;

        async function loadDataAndRefresh() {
            try {
                const response = await fetch('etf_data.json?' + new Date().getTime());
                if (!response.ok) throw new Error('無法取得 JSON 檔案');
                globalData = await response.json();
                switchTab(currentTab);
            } catch (err) {
                console.error("載入 etf_data.json 失敗", err);
                document.getElementById('main-viewport').innerHTML = `
                    <div class="p-6 bg-red-950/30 border border-red-500/30 rounded-2xl text-red-400">
                        <p class="font-bold">⚠️ 載入 etf_data.json 發生錯誤</p>
                        <p class="text-xs text-slate-400 mt-1">詳細錯誤：${err.message}</p>
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadDataAndRefresh();
        });

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800/80";
            });
            const activeBtn = document.getElementById(`nav-${tabId}`);
            if (activeBtn) {
                activeBtn.className = "nav-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white shadow";
            }

            if (tabId === 'overview') {
                document.getElementById('current-page-title').innerText = '總覽與績效比較面板';
                renderOverviewPage();
            } else if (tabId === 'active-summary') {
                document.getElementById('current-page-title').innerText = '五檔主動式ETF持股總統計與動態變動聚合';
                renderActiveSummaryPage();
            } else {
                renderStockDetailPage(tabId);
            }
            if (window.lucide) lucide.createIcons();
        }

        function renderOverviewPage() {
            const viewport = document.getElementById('main-viewport');
            if (!globalData || !globalData.etfs) return;

            let html = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-cardbg border border-bordercolor p-5 rounded-2xl shadow">
                        <p class="text-xs text-slate-400">追蹤總標的數</p>
                        <p class="text-2xl font-bold text-white mt-1">10 <span class="text-xs font-normal text-slate-400">檔</span></p>
                    </div>
                    <div class="bg-cardbg border border-bordercolor p-5 rounded-2xl shadow">
                        <p class="text-xs text-slate-400">主動式ETF群組</p>
                        <p class="text-2xl font-bold text-emerald-400 mt-1">5 <span class="text-xs font-normal text-slate-400">檔動態追蹤</span></p>
                    </div>
                    <div class="bg-cardbg border border-bordercolor p-5 rounded-2xl shadow">
                        <p class="text-xs text-slate-400">系統最後更新時間</p>
                        <p class="text-sm font-mono font-bold text-blue-400 mt-2">${globalData.update_time || '即時連線中'}</p>
                    </div>
                </div>

                <div class="bg-cardbg border border-bordercolor rounded-2xl shadow-lg overflow-hidden">
                    <div class="p-5 border-b border-bordercolor flex justify-between items-center">
                        <h3 class="font-bold text-white text-base">十檔核心焦點標的全覽表</h3>
                        <button onclick="switchTab('active-summary')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold flex items-center space-x-1.5 shadow">
                            <i data-lucide="layers" class="w-4 h-4"></i>
                            <span>查看五檔主動式ETF持股總統計</span>
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-900/60 text-slate-400 text-xs uppercase border-b border-bordercolor">
                                    <th class="py-3 px-4">代號與名稱</th>
                                    <th class="py-3 px-4">資產類型</th>
                                    <th class="py-3 px-4 text-right">即時價格</th>
                                    <th class="py-3 px-4 text-right">漲跌幅</th>
                                    <th class="py-3 px-4 text-right">今年YTD</th>
                                    <th class="py-3 px-4 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-bordercolor text-sm">
            `;

            globalData.etfs.forEach(item => {
                const price = typeof item.price === 'number' ? item.price.toFixed(2) : (item.price || '-');
                const changePct = typeof item.changePercent === 'number' ? item.changePercent : 0;
                const isPos = changePct >= 0;

                html += `
                    <tr class="hover:bg-slate-800/50 cursor-pointer" onclick="switchTab('${item.code}')">
                        <td class="py-3.5 px-4 font-bold text-white"><span class="text-blue-400 mr-2">${item.code}</span>${item.name || ''}</td>
                        <td class="py-3.5 px-4"><span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300">${item.category || 'ETF'}</span></td>
                        <td class="py-3.5 px-4 text-right font-mono font-semibold">${price}</td>
                        <td class="py-3.5 px-4 text-right font-mono ${isPos ? 'text-emerald-400' : 'text-red-400'}">${isPos ? '+' : ''}${changePct}%</td>
                        <td class="py-3.5 px-4 text-right font-mono text-emerald-400">${item.ytdReturn || '-'}</td>
                        <td class="py-3.5 px-4 text-center"><button onclick="event.stopPropagation(); switchTab('${item.code}');" class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs">查看面板</button></td>
                    </tr>
                `;
            });
            html += `</tbody></table></div></div>`;
            viewport.innerHTML = html;
        }

        function renderActiveSummaryPage() {
            const viewport = document.getElementById('main-viewport');
            if (!globalData || !globalData.etfs) return;

            const activeEtfs = globalData.etfs.filter(e => e.type === 'active');

            let html = `
                <div class="space-y-6">
                    <div class="bg-cardbg border border-bordercolor p-6 rounded-2xl shadow-lg">
                        <h3 class="text-lg font-bold text-white flex items-center space-x-2">
                            <i data-lucide="pie-chart" class="w-5 h-5 text-emerald-400"></i>
                            <span>五檔主動式ETF持股與動態總彙整</span>
                        </h3>
                        <p class="text-xs text-slate-400 mt-1">完整統計 5 位經理人近期在各成分股上的加碼、減碼、新納入狀態、張數與權重佔比。</p>
                    </div>
            `;

            activeEtfs.forEach(etf => {
                html += `
                    <div class="bg-cardbg border border-bordercolor rounded-2xl shadow-lg overflow-hidden">
                        <div class="p-4 bg-slate-900/60 border-b border-bordercolor flex justify-between items-center cursor-pointer" onclick="switchTab('${etf.code}')">
                            <div class="flex items-center space-x-3">
                                <span class="font-black text-emerald-400 text-lg">${etf.code}</span>
                                <h4 class="font-bold text-white">${etf.name || ''}</h4>
                                <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400">YTD: ${etf.ytdReturn || '-'}</span>
                            </div>
                            <button class="text-xs text-blue-400 hover:underline">查看專屬面板 →</button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-slate-900/30 text-slate-400 text-xs uppercase border-b border-bordercolor">
                                        <th class="py-2.5 px-4">持股代號與名稱</th>
                                        <th class="py-2.5 px-4">持股張數</th>
                                        <th class="py-2.5 px-4">權重比例</th>
                                        <th class="py-2.5 px-4">變動狀態</th>
                                        <th class="py-2.5 px-4">買賣與調節操作紀錄</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-bordercolor">
                `;

                if (etf.holdings && Array.isArray(etf.holdings) && etf.holdings.length > 0) {
                    etf.holdings.forEach(h => {
                        let badge = 'bg-slate-800 text-slate-300';
                        if (h.changeState === '加碼') badge = 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                        if (h.changeState === '減碼') badge = 'bg-red-500/10 text-red-400 border border-red-500/20';
                        if (h.changeState === '新納入') badge = 'bg-blue-500/10 text-blue-400 border border-blue-500/20';

                        html += `
                            <tr class="hover:bg-slate-800/40">
                                <td class="py-3 px-4 font-bold text-white"><span class="text-blue-400 mr-2">${h.symbol || ''}</span>${h.name || ''}</td>
                                <td class="py-3 px-4 font-mono text-slate-300">${h.shares || '-'}</td>
                                <td class="py-3 px-4 font-mono font-semibold text-white">${h.weight || '-'}</td>
                                <td class="py-3 px-4"><span class="text-xs px-2 py-0.5 rounded ${badge}">${h.changeState || '持平'}</span></td>
                                <td class="py-3 px-4 text-slate-400 text-xs">${h.actionLog || '-'}</td>
                            </tr>
                        `;
                    });
                } else {
                    html += `<tr><td colspan="5" class="py-4 text-center text-slate-500 text-xs">目前暫無詳細持股數據。</td></tr>`;
                }

                html += `</tbody></table></div></div>`;
            });

            html += `</div>`;
            viewport.innerHTML = html;
        }

        function renderStockDetailPage(symbol) {
            const stock = globalData.etfs.find(e => e.code === symbol);
            const viewport = document.getElementById('main-viewport');
            if (!stock) return;

            document.getElementById('current-page-title').innerText = `${stock.code} ${stock.name}`;

            const price = typeof stock.price === 'number' ? stock.price.toFixed(2) : (stock.price || '-');
            const changePct = typeof stock.changePercent === 'number' ? stock.changePercent : 0;
            const isPos = changePct >= 0;

            let html = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-1 space-y-6">
                        <div class="bg-cardbg border border-bordercolor p-6 rounded-2xl shadow-lg space-y-4">
                            <div>
                                <span class="text-xs px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 font-semibold">${stock.category}</span>
                                <h3 class="text-2xl font-bold text-white mt-2">${stock.name}</h3>
                                <p class="text-xs text-slate-400 mt-1">${stock.description}</p>
                            </div>
                            <div class="pt-4 border-t border-bordercolor flex justify-between items-center">
                                <div>
                                    <p class="text-xs text-slate-400">即時價格</p>
                                    <p class="text-3xl font-mono font-bold text-white mt-1">${price}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-xs text-slate-400">漲跌幅</p>
                                    <p class="text-xl font-mono font-bold ${isPos ? 'text-emerald-400' : 'text-red-400'} mt-1">${isPos ? '+' : ''}${changePct}%</p>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3 pt-4 border-t border-bordercolor text-sm">
                                <div class="bg-slate-900/40 p-3 rounded-xl">
                                    <p class="text-xs text-slate-400">今年 YTD 報酬</p>
                                    <p class="font-mono font-bold text-emerald-400 mt-1">${stock.ytdReturn || '-'}</p>
                                </div>
                                <div class="bg-slate-900/40 p-3 rounded-xl">
                                    <p class="text-xs text-slate-400">預估淨值 (NAV)</p>
                                    <p class="font-mono font-bold text-white mt-1">${stock.nav || price}</p>
                                </div>
                            </div>
                        </div>
            `;

            if (stock.type === 'leveraged' && stock.leverageInfo) {
                html += `
                        <div class="bg-cardbg border border-bordercolor p-6 rounded-2xl shadow-lg space-y-3">
                            <h4 class="font-bold text-white text-sm flex items-center space-x-2">
                                <i data-lucide="shield-alert" class="w-4 h-4 text-amber-400"></i>
                                <span>槓桿與期貨維持率資訊</span>
                            </h4>
                            <div class="text-xs space-y-2 text-slate-300">
                                <div class="flex justify-between py-1 border-b border-bordercolor">
                                    <span class="text-slate-400">槓桿倍數</span>
                                    <span class="font-mono font-bold text-amber-400">${stock.leverageInfo.multiplier}</span>
                                </div>
                                <div class="flex justify-between py-1 border-b border-bordercolor">
                                    <span class="text-slate-400">追蹤指數</span>
                                    <span class="font-semibold">${stock.leverageInfo.trackingIndex}</span>
                                </div>
                                <div class="flex justify-between py-1">
                                    <span class="text-slate-400">期貨維持率</span>
                                    <span class="font-mono text-emerald-400">${stock.leverageInfo.futuresMarginRatio}</span>
                                </div>
                            </div>
                        </div>
                `;
            }

            html += `
                    </div>
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-cardbg border border-bordercolor p-6 rounded-2xl shadow-lg">
                            <h4 class="font-bold text-white mb-4 text-sm flex items-center space-x-2">
                                <i data-lucide="line-chart" class="w-4 h-4 text-blue-400"></i>
                                <span>近期價格走勢圖</span>
                            </h4>
                            <div class="h-64 relative">
                                <canvas id="detailChart"></canvas>
                            </div>
                        </div>
            `;

            if (stock.holdings && stock.holdings.length > 0) {
                html += `
                        <div class="bg-cardbg border border-bordercolor rounded-2xl shadow-lg overflow-hidden">
                            <div class="p-5 border-b border-bordercolor">
                                <h4 class="font-bold text-white text-sm">成分股與經理人操作細目</h4>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-sm">
                                    <thead>
                                        <tr class="bg-slate-900/60 text-slate-400 text-xs uppercase border-b border-bordercolor">
                                            <th class="py-3 px-4">代號與名稱</th>
                                            <th class="py-3 px-4">張數</th>
                                            <th class="py-3 px-4">權重</th>
                                            <th class="py-3 px-4">狀態</th>
                                            <th class="py-3 px-4">操作紀錄</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-bordercolor">
                `;
                stock.holdings.forEach(h => {
                    html += `
                        <tr class="hover:bg-slate-800/40">
                            <td class="py-3 px-4 font-bold text-white"><span class="text-blue-400 mr-2">${h.symbol}</span>${h.name}</td>
                            <td class="py-3 px-4 font-mono text-slate-300">${h.shares || '-'}</td>
                            <td class="py-3 px-4 font-mono font-semibold text-white">${h.weight || '-'}</td>
                            <td class="py-3 px-4"><span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300">${h.changeState || '持平'}</span></td>
                            <td class="py-3 px-4 text-slate-400 text-xs">${h.actionLog || '-'}</td>
                        </tr>
                    `;
                });
                html += `</tbody></table></div></div>`;
            }

            html += `</div></div>`;
            viewport.innerHTML = html;

            setTimeout(() => {
                const ctx = document.getElementById('detailChart');
                if (ctx && stock.chartData) {
                    if (activeChart) activeChart.destroy();
                    activeChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: stock.chartData.labels,
                            datasets: [{
                                label: stock.name + ' 收盤價',
                                data: stock.chartData.prices,
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                                y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                            }
                        }
                    });
                }
            }, 50);
        }
    </script>
</body>
</html>
