                    <div class="p-5 border-b border-bordercolor">
                        <h3 class="font-bold text-white text-base">${isActive ? '主動式ETF持股與動態變動紀錄' : '期貨合約部位與資產配置追蹤'}</h3>
                        <p class="text-xs text-slate-400">即時追蹤核心配置與操作動向</p>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-900/60 text-slate-400 text-xs uppercase border-b border-bordercolor">
                                    <th class="py-3 px-4">${isActive ? '持股代號與名稱' : '期貨/資產代號'}</th>
                                    <th class="py-3 px-4">${isActive ? '持股張數/權重' : '部位說明'}</th>
                                    <th class="py-3 px-4">權重比例</th>
                                    <th class="py-3 px-4">變動狀態</th>
                                    <th class="py-3 px-4">連續天數</th>
                                    <th class="py-3 px-4">操作紀錄</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-bordercolor text-sm">
            `;

            stock.holdings.forEach(h => {
                let badge = 'bg-slate-800 text-slate-300 border-slate-700';
                if (h.changeState === '加碼') badge = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                if (h.changeState === '減碼') badge = 'bg-red-500/10 text-red-400 border-red-500/20';
                if (h.changeState === '新納入') badge = 'bg-blue-500/10 text-blue-400 border-blue-500/20';

                html += `
                    <tr class="hover:bg-slate-800/40">
                        <td class="py-3.5 px-4 font-bold text-white"><span class="text-blue-400 mr-2">${h.symbol}</span>${h.name}</td>
                        <td class="py-3.5 px-4 font-mono text-slate-300">${h.shares}</td>
                        <td class="py-3.5 px-4 font-mono font-semibold text-white">${h.weight}</td>
                        <td class="py-3.5 px-4"><span class="text-xs px-2 py-0.5 rounded border ${badge}">${h.changeState}</span></td>
                        <td class="py-3.5 px-4 font-mono text-slate-300">${h.streak > 0 ? h.streak + ' 天' : '-'}</td>
                        <td class="py-3.5 px-4 text-slate-400 text-xs">${h.actionLog}</td>
                    </tr>
                `;
            });
            html += `</tbody></table></div></div>`;
            viewport.innerHTML = html;
            lucide.createIcons();
            renderStockChart(symbol, '1Y');
        }

        function changeTimeframe(symbol, timeframe) {
            ['1M', '3M', '1Y', 'ALL'].forEach(tf => {
                const btn = document.getElementById(`btn-${tf}`);
                if (btn) btn.className = tf === timeframe ? "px-3 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow" : "px-3 py-1 rounded-lg text-xs font-medium text-slate-300";
            });
            renderStockChart(symbol, timeframe);
        }

        function renderStockChart(symbol, timeframe) {
            const stock = stockData[symbol];
            const ctx = document.getElementById('stockDetailChart').getContext('2d');
            if (activeChart) activeChart.destroy();

            let labels = stock.chartData.labels;
            let prices = stock.chartData.prices;
            if (timeframe === '1M') { labels = labels.slice(-3); prices = prices.slice(-3); }
            else if (timeframe === '3M') { labels = labels.slice(-6); prices = prices.slice(-6); }

            activeChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: prices, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 3, fill: true, tension: 0.3, pointRadius: 4
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: 'rgba(51, 65, 85, 0.4)' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
