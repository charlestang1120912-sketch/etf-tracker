name: Auto Update ETF Data

on:
  schedule:
    - cron: '0 10 * * 1-5' # 每個工作日自動執行
  workflow_dispatch: # 允許手動觸發

jobs:
  update-data:
  runs-on: ubuntu-latest
  steps:
    - name: 取得專案程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 執行更新腳本
      run: python etf_data.py

    - name: 自動提交並推送更新後的資料
      uses: stefanzweig/git-auto-commit-action@v4 # 或是你原本使用的 commit action
      with:
        commit_message: "Auto-update ETF real-time data"
        file_pattern: etf_data.json
