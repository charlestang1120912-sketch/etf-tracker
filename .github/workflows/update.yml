name: Auto Update ETF Data

on:
  schedule:
    # 每天台灣時間晚上 6 點 (UTC 10:00) 自動執行
    - cron: '0 10 * * *'
  workflow_dispatch: # 允許你隨時手動點擊按鈕更新

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 執行更新腳本
        run: python etf_data.py

      - name: 自動提交並推送更新後的資料
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@example.com"
          git add etf_data.json
          git commit -m "Auto-update ETF data by bot" || exit 0
          git push
