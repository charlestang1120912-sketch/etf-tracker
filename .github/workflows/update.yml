name: Auto Update ETF Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5' # 每個營業日台灣時間下午 4:30 自動執行

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予寫入權限以便自動更新 json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run ETF data fetcher script
        run: python etf_data.py

      - name: Commit and push if changes exist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add etf_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ETF data via yfinance" && git push)
